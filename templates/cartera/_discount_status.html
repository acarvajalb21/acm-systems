{% if r.status == 'pending' %}<span class="chip warn">En espera de la dirección</span>{% elif r.status == 'approved' %}<span class="chip ok">Aprobada{% if r.decided_by %} por {{ r.decided_by.display_name }}{% endif %}</span>{% elif r.status == 'rejected' %}<span class="chip bad">Rechazada</span>{% elif r.status == 'withdrawn' %}<span class="chip plain">Retirada</span>{% else %}<span class="chip plain">Sin efecto</span>{% endif %}
