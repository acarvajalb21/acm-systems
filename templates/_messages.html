{% if messages %}<div class="messages">{% for message in messages %}<div class="message {{ message.tags }}" role="{% if message.tags == 'error' %}alert{% else %}status{% endif %}">{% if message.tags == 'error' %}{% icon 'alert-circle' %}{% else %}{% icon 'check-circle' %}{% endif %}<span>{{ message }}</span><button type="button" data-dismiss aria-label="Cerrar">{% icon 'x' 'sm' %}</button></div>{% endfor %}</div>{% endif %}
