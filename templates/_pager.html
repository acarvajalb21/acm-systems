{% if page.paginator.num_pages > 1 %}<div class="card-foot"><div class="actions between"><span class="muted">Página {{ page.number }} de {{ page.paginator.num_pages }} · {{ page.paginator.count|num }} registros</span><span class="actions">{% if page.has_previous %}<a class="btn btn-sm" href="?{% if query %}{{ query }}&{% endif %}pagina={{ page.previous_page_number }}">{% icon 'arrow-left' 'sm' %}Anterior</a>{% endif %}{% if page.has_next %}<a class="btn btn-sm" href="?{% if query %}{{ query }}&{% endif %}pagina={{ page.next_page_number }}">Siguiente {% icon 'arrow-right' 'sm' %}</a>{% endif %}</span></div></div>{% endif %}
