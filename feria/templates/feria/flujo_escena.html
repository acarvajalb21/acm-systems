{% comment %}Dibujo de una estación (plataforma, conducto y objeto). Parámetros: st (estación) y pulso (verdadero para animar el conducto).
La geometría llega calculada desde feria/flow.py; el color lo pone static/modulos/flujo.css.{% endcomment %}<svg class="flujo-escena" viewBox="0 22 200 100" aria-hidden="true" focusable="false">
{% for s in st.scene %}{% if s.t == 'polygon' %}<polygon class="{{ s.c }}" points="{{ s.p }}"></polygon>{% elif s.t == 'rect' %}<rect class="{{ s.c }}" x="{{ s.x }}" y="{{ s.y }}" width="{{ s.w }}" height="{{ s.h }}" rx="{{ s.rx }}"></rect>{% elif s.t == 'line' %}<line class="{{ s.c }}" x1="{{ s.x1 }}" y1="{{ s.y1 }}" x2="{{ s.x2 }}" y2="{{ s.y2 }}"></line>{% elif s.t == 'circle' %}<circle class="{{ s.c }}" cx="{{ s.cx }}" cy="{{ s.cy }}" r="{{ s.r }}"></circle>{% elif s.t == 'ellipse' %}<ellipse class="{{ s.c }}" cx="{{ s.cx }}" cy="{{ s.cy }}" rx="{{ s.rx }}" ry="{{ s.ry }}"></ellipse>{% elif s.t == 'path' %}<path class="{{ s.c }}" d="{{ s.d }}"></path>{% elif s.t == 'text' %}<text class="{{ s.c }}" x="{{ s.x }}" y="{{ s.y }}" text-anchor="middle">{{ s.text }}</text>{% endif %}
{% endfor %}{% if pulso %}<clipPath id="flujo-tramo-{{ st.key }}">{% for c in st.clip %}<rect x="{{ c.x }}" y="{{ c.y }}" width="{{ c.w }}" height="{{ c.h }}"></rect>{% endfor %}</clipPath>
<g clip-path="url(#flujo-tramo-{{ st.key }})"><rect class="flujo-pulso" x="0" y="101.5" width="14" height="3" rx="1.5"></rect></g>{% endif %}
</svg>
